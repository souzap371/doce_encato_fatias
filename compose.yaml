services:
  doce-encanto:
    build: .
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      APP_ADDRESS: 0.0.0.0
      APP_USER: ${APP_USER:-admin}
      APP_PASSWORD: ${APP_PASSWORD:?Defina APP_PASSWORD no arquivo .env}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
      DB_PATH: /app/data/doceencanto
    volumes:
      - doce_dados:/app/data
volumes:
  doce_dados:
