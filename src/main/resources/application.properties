spring.application.name=Doce Encanto
server.address=${APP_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
spring.datasource.url=jdbc:h2:file:${DB_PATH:./data/doceencanto};DB_CLOSE_ON_EXIT=FALSE;WRITE_DELAY=0
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
spring.mvc.hiddenmethod.filter.enabled=true
server.error.include-message=never
app.usuario=admin
app.senha=T@130file
server.servlet.session.timeout=8h
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
