<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Novo evento • Doce Encanto</title><link rel="stylesheet" href="/style.css"></head><body>
<header><a href="/" class="brand"><img class="brand-logo" src="/images/logo-doce-encanto.png" alt="Doce Encanto"><span class="brand-text">Doce Encanto<small>Confeitaria afetiva</small></span></a><nav><a href="/">Visão geral</a><a href="/produtos">Bolos & custos</a><form th:action="@{/logout}" method="post"><button class="logout">Sair</button></form></nav></header>
<main><div class="crumbs"><a href="/">Visão geral</a> &nbsp;/&nbsp; Novo evento</div><div class="title"><div><p class="eyebrow">NOVO PLANEJAMENTO</p><h1>Onde seus bolos vão encantar?</h1><p>Crie o evento e depois escolha quantos bolos levar, o preço de cada fatia e as despesas da ocasião.</p></div></div><section><form th:action="@{/eventos}" method="post" class="grid grid-wide"><label>Nome do evento<input name="nome" type="text" placeholder="Ex.: Feira de Primavera" required></label><label>Local<input name="local" type="text" placeholder="Ex.: Centro de Convenções" required></label><label>Data do evento<input name="data" type="date" required></label><label>Observações<textarea name="observacoes" placeholder="Horário, contato, estrutura, detalhes importantes..."></textarea></label><button>Criar planejamento →</button></form></section></main><footer>Doce Encanto · Planeje com carinho, venda com confiança.</footer></body></html>
